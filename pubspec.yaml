name: build_ledger
description: "BuildLedger - Construction Site Expense Tracker & Financial Control"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local Database
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4

  # File Storage & Paths
  path_provider: ^2.1.5
  path: ^1.9.1

  # Formatting & Localization
  intl: ^0.20.2

  # Security & Cryptography (Authenticated AES-256-GCM Backup Encryption)
  cryptography: ^2.7.2
  crypto: ^3.0.7

  # Archive (ZIP container for backups)
  archive: ^4.0.2

  # UUID generation
  uuid: ^4.5.1

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.14.0

  # CSV Export
  csv: ^6.0.0

  # Native Sharing
  share_plus: ^10.1.4

  # Media & Receipts
  image_picker: ^1.1.2

  # Modern Typography
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8
  sqflite_common_ffi_web: ^1.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F1C2D"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0F1C2D"
    theme_color: "#0F1C2D"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
